# Local development only. No HTTP authentication; binds strictly to 127.0.0.1.
set dolu_fivem_mcp_port 3210
set dolu_fivem_mcp_ace "dolu_fivem_mcp.use"
set dolu_fivem_mcp_cdp_port 13172
set dolu_fivem_mcp_cdp_player 0
set dolu_fivem_mcp_max_active 8

add_ace resource.dolu_fivem_mcp command allow
add_ace group.admin dolu_fivem_mcp.use allow

# Your developer must already inherit group.admin.
# Otherwise grant dolu_fivem_mcp.use directly to your existing player principal.
# add_ace identifier.license:YOUR_LICENSE dolu_fivem_mcp.use allow

ensure dolu_fivem_mcp
